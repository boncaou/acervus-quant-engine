/* ================= OPTIMIZADOR ================= */
function projBox(v,lo,hi){let a=Math.min(...v)-hi-1,b=Math.max(...v)-lo+1;for(let it=0;it<80;it++){const m=(a+b)/2;let s=0;for(const x of v)s+=Math.min(hi,Math.max(lo,x-m));if(s>1)a=m;else b=m}const m=(a+b)/2;return v.map(x=>Math.min(hi,Math.max(lo,x-m)))}
function matVec(M,v){return M.map(r=>r.reduce((s,x,j)=>s+x*v[j],0))}
function maxEig(M){let v=M.map(()=>1);let l=1;for(let i=0;i<60;i++){const u=matVec(M,v);l=Math.sqrt(u.reduce((s,x)=>s+x*x,0));v=u.map(x=>x/l)}return l}
function solveQP(Sg,mu,lam,lo,hi,w0,it=1500){const L=2*maxEig(Sg)||1,st=1/L;let w=w0?[...w0]:projBox(mu.map(()=>1/mu.length),lo,hi);
  for(let i=0;i<it;i++){const g=matVec(Sg,w).map((x,j)=>2*x-lam*mu[j]);const nw=projBox(w.map((x,j)=>x-st*g[j]),lo,hi);let d=0;for(let j=0;j<w.length;j++)d=Math.max(d,Math.abs(nw[j]-w[j]));w=nw;if(d<1e-9)break}return w}
function riskParity(Sg,lo,hi){const n=Sg.length;let w=Sg.map((r,i)=>1/Math.sqrt(r[i]));const s=w.reduce((a,b)=>a+b,0);w=projBox(w.map(x=>x/s),lo,hi);
  for(let it=0;it<400;it++){const Sw=matVec(Sg,w),vp=w.reduce((a,x,i)=>a+x*Sw[i],0);w=w.map((x,i)=>x*Math.sqrt((vp/n)/Math.max(1e-18,x*Sw[i])));const t=w.reduce((a,b)=>a+b,0);w=projBox(w.map(x=>x/t),lo,hi)}return w}
function runOpt(){
  const [s0,s1]=range(),list=sel(),O=ST.o,f=ST.freq;const n=list.length;if(n<2)return null;
  let sp=idxOfYear(O.split);if(sp<=s0+261||sp>=s1-60)sp=null;const tEnd=sp?sp-1:s1;
  const X=list.map(s=>agg(s.r,s0,tEnd,f)),T=X[0].length,mu=X.map(mean),ppy=PPY[f];
  const Sg=[];for(let i=0;i<n;i++){Sg.push([]);for(let j=0;j<n;j++){let c=0;for(let t=0;t<T;t++)c+=(X[i][t]-mu[i])*(X[j][t]-mu[j]);Sg[i][j]=c/(T-1)}}
  const sh=O.shrink/100;for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(i!==j)Sg[i][j]*=(1-sh);
  const Sm=[];for(let i=0;i<n;i++){Sm.push([]);for(let j=0;j<n;j++){let c=0;for(let t=0;t<T;t++)c+=Math.min(X[i][t],0)*Math.min(X[j][t],0);Sm[i][j]=c/T}}
  let lo=O.lo/100,hi=O.hi/100;if(hi*n<1){hi=1/n}if(lo*n>1)lo=0;
  const pv=w=>{const Sw=matVec(Sg,w),r=w.reduce((a,x,i)=>a+x*mu[i],0)*ppy,v=Math.sqrt(Math.max(0,w.reduce((a,x,i)=>a+x*Sw[i],0))*ppy);return {r,v,sr:v?(r-ST.rf/100)/v:0}};
  const sc=Math.max(...mu.map(Math.abs)),tr=Sg.reduce((a,r,i)=>a+r[i],0)/n;const muN=mu.map(x=>x/sc),SgN=Sg.map(r=>r.map(x=>x/tr));
  const front=[];let w=null;const lams=[0,...Array.from({length:34},(_,i)=>0.002*Math.pow(1.38,i))];
  for(const l of lams){w=solveQP(SgN,muN,l,lo,hi,w,900);front.push({l,w:[...w],...pv(w)})}
  let res;const ord=mu.map((m,i)=>[m,i]).sort((a,b)=>b[0]-a[0]);
  if(O.obj==='sharpe'){res=front.reduce((a,b)=>b.sr>a.sr?b:a).w}
  else if(O.obj==='minvar'){res=front[0].w}
  else if(O.obj==='semivar'){const t2=Sm.reduce((a,r,i)=>a+r[i],0)/n;res=solveQP(Sm.map(r=>r.map(x=>x/t2)),muN,0,lo,hi,null,2500)}
  else if(O.obj==='maxret'){const cap=O.volcap/100;const ok=front.filter(p=>p.v<=cap);if(ok.length&&cap>0){res=ok.reduce((a,b)=>b.r>a.r?b:a).w}else if(cap>0){res=front[0].w}else{res=new Array(n).fill(lo);let left=1-lo*n;for(const [,i] of ord){const add=Math.min(hi-lo,left);res[i]+=add;left-=add;if(left<=1e-12)break}}}
  else if(O.obj==='rp'){res=riskParity(Sg,lo,hi)}
  else if(O.obj==='eq'){res=projBox(new Array(n).fill(1/n),lo,hi)}
  const cloud=[];for(let k=0;k<500;k++){let g=list.map(()=>-Math.log(Math.random()));const s=g.reduce((a,b)=>a+b,0);g=g.map(x=>x/s);cloud.push(pv(g))}
  const wmap={};list.forEach((s,i)=>wmap[s.id]=res[i]);
  return {list,res,wmap,front,cloud,mu,Sg,ppy,pv,sp,s0,s1,tEnd,lo,hi,singles:list.map((s,i)=>({n:s.label,x:Math.sqrt(Sg[i][i]*ppy),y:mu[i]*ppy}))}
}

  el.innerHTML=`<h2>Optimizador de pesos</h2>

const RGL={trend:['Tendencia del ETF',{alcista:'tendencia alcista',bajista:'tendencia bajista'},['alcista','bajista']],
  vol:['Volatilidad del ETF',{baja:'volatilidad baja',media:'volatilidad media',alta:'volatilidad alta'},['baja','media','alta']],
  corr:['S&P en corrección',{no:'S&P sin corrección',sí:'S&P en corrección (−10% o más)'},['no','sí']]};
const RGS={alcista:'alcista',bajista:'bajista',baja:'vol. baja',media:'vol. media',alta:'vol. alta',sí:'en corrección',no:'sin corrección'};
function regRead(rg){
  const best=[],worse=[],lose=[];
  if(!rg)return {txt:'Sin backtest: no se puede medir.',short:'—'};
  for(const k of ['trend','vol','corr']){const g=Object.entries(rg[k]||{}).filter(([,v])=>v.n>=30&&v.pf!=null);if(g.length<2)continue;
    g.sort((a,b)=>b[1].pf-a[1].pf);const [bk,bv]=g[0],[wk,wv]=g[g.length-1];
    if(bv.pf/wv.pf>=1.25){best.push([k,bk,bv,wk,wv])}
    for(const [gk,gv] of g)if(gv.pf<1)lose.push(RGL[k][1][gk]);}
  const txt=best.length?'Le va mejor con '+best.map(([k,bk,bv,wk,wv])=>`<b>${RGL[k][1][bk]}</b> (PF ${fmt(bv.pf)} contra ${fmt(wv.pf)} con ${RGL[k][1][wk]})`).join(', con ')+'.':'Le va parecido en todos los regímenes (ninguna diferencia de PF mayor a 25%).';
  return {txt:txt+(lose.length?` <span class="neg">Pierde dinero con ${lose.join(' y con ')}.</span>`:''),short:best.length?best.map(b=>RGS[b[1]]).join(' · '):'parecido en todos'};
}
function rLogica(){
  const el=document.getElementById('v-logica'),LG=D.logica,IT=LG.items;
  if(!ST.lg)ST.lg=IT[0].name;const L=IT.find(x=>x.name===ST.lg),S2=L.stats,R2=S2&&S2.risk;
  const stopTxt=o=>o.stats&&o.stats.risk.stopPct!=null?'≈ '+pct(o.stats.risk.stopPct,1):'';
  const exitTime=o=>o.mt===1?'al día siguiente':`a los ${o.mt} días`;
  const rr=regRead(S2&&S2.regimes);
  const regRows=S2?['trend','vol','corr'].map(k=>{const g=S2.regimes[k]||{},ok=RGL[k][2].filter(x=>g[x]);const pfs=ok.filter(x=>g[x].n>=30).map(x=>g[x].pf);const mx=Math.max(...pfs);
    return ok.map((x,i)=>{const v=g[x];return `<tr>${i===0?`<td class="l" rowspan="${ok.length}"><b>${RGL[k][0]}</b></td>`:''}<td class="l">${RGS[x]}</td><td class="num">${v.n}${v.n<30?' <span class="small">pocos</span>':''}</td><td class="num">${pct(v.win,0)}</td><td class="num ${v.avg<0?'neg':''}">${pct(v.avg,2)}</td><td class="num ${v.pf<1?'neg':(v.pf===mx&&pfs.length>1&&v.n>=30?'pos':'')}">${fmt(v.pf)}</td></tr>`}).join('')}).join(''):'';
  const owns=S2?S2.owns.filter(x=>x!=='SPY'):[];
  el.innerHTML=`<div class="flex" style="justify-content:space-between;align-items:end"><h2>Lógica de cada estrategia</h2>
   <div class="ctl"><label for="lg-s">Estrategia</label><select id="lg-s">${IT.map(o=>`<option value="${o.name}" ${o.name===L.name?'selected':''}>${o.num} · ${o.name}${o.status==='activa'?'':' ('+o.status+')'}</option>`).join('')}</select></div></div>
  <div class="panel"><h3>Lo que tienen en común las 22</h3>
   <ul style="margin:0 0 0 18px;padding:0;font-size:13.5px;line-height:1.55;max-width:100ch">
    <li><b>Solo compran.</b> Ninguna vende en corto. 1 contrato fijo del futuro.</li>
    <li><b>La señal se mira al cierre</b>, con las velas diarias del ETF (Data2) y, en las "IM", de otro mercado (Data3). Si se cumple todo, <b>compra a mercado en la apertura siguiente</b>.</li>
    <li><b>Stop de precio fijo.</b> El día de la señal calcula <b>cierre − k × ATR(20)</b>, con el cierre y el ATR del <b>futuro</b> (Data1), y lo deja quieto mientras dura el trade. Es una orden stop: si el mercado abre por debajo, sale en la apertura, más abajo que el stop.</li>
    <li><b>Salida por tiempo.</b> Si no tocó el stop, sale a mercado en la apertura después de Max_Time días. <b>Ninguna tiene objetivo de ganancia.</b> La única con una salida extra es IM-VOL10-DOWX3: sale en la apertura siguiente al primer cierre en ganancia.</li>
    <li>Fuente: los códigos finales del 03/11 (<span class="num">/codigos/finales/</span>). Los números de abajo son del backtest en ETFs.</li></ul></div>
  <div class="warnbox"><b>Patrón general.</b> ${(()=>{const w=IT.filter(o=>o.stats);const c=k=>w.filter(o=>{const g=o.stats.regimes[k[0]];return g[k[1]]&&g[k[2]]&&g[k[1]].n>=30&&g[k[1]].pf>g[k[2]].pf}).length;return `De las ${w.length} con backtest, ${c(['vol','alta','baja'])} tienen mejor PF con volatilidad alta que con baja, y ${c(['corr','sí','no'])} con el S&P en corrección que sin ella.`})()} Casi todas compran después de una caída o de un día flojo, así que ganan más cuando el mercado está nervioso. Lo mismo vale al revés: varias de sus peores pérdidas también caen en esos meses (2008, 2020, 2022). Con volatilidad baja ganan menos${(()=>{const l=IT.filter(o=>o.stats&&o.stats.regimes.vol.baja&&o.stats.regimes.vol.baja.n>=30&&o.stats.regimes.vol.baja.pf<1).map(o=>o.name);return l.length?', y '+l.length+' pierden dinero ('+l.join(', ')+')':''})()}.</div>
  <div class="tbl"><table><thead><tr><th class="l">#</th><th class="l">Estrategia</th><th class="l">Tipo</th><th class="l">Dónde opera</th><th class="l">Le va mejor</th><th>Stop</th><th>Sale por tiempo</th><th>Salen por stop</th></tr></thead><tbody>
   ${IT.map(o=>`<tr class="click ${o.status==='activa'?'':'off'}" data-n="${o.name}" ${o.name===L.name?'style="outline:2px solid var(--accent);outline-offset:-2px"':''}><td class="l num">${o.num}</td><td class="l"><b>${o.name}</b>${o.status==='activa'?'':' <span class="small">'+o.status+'</span>'}</td><td class="l">${esc(o.fam)}</td><td class="l small">${esc(o.where)}</td><td class="l small">${regRead(o.stats&&o.stats.regimes).short}</td><td class="num">${o.k} ATR <span class="small">${stopTxt(o)}</span></td><td class="num">${exitTime(o)}</td><td class="num">${o.stats?pct(o.stats.risk.slPct,0):'–'}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="panel" style="display:flex;flex-direction:column;gap:14px">
   <div class="flex" style="gap:10px"><h3 style="margin:0">${L.num} · ${esc(L.name)} FUT</h3><span class="chip c-${L.status==='activa'?'activa':L.status==='excluida'?'excluida':L.status}">${L.status}</span><span class="small">${esc(L.fam)} · ${esc(L.where)}</span></div>
   <div class="grid2">
    <div><h3>Cuándo compra</h3><p class="note">Al cierre del día tienen que cumplirse <b>todas</b> estas condiciones:</p>
     <ol style="margin:6px 0 8px 18px;padding:0;font-size:13.5px;line-height:1.55">${L.buy.map(b=>`<li>${b}</li>`).join('')}</ol>
     <p class="note">Entonces compra 1 contrato a mercado en la apertura del día siguiente.</p>
     <p class="note" style="margin-top:8px"><b>Por qué podría funcionar.</b> ${esc(L.why)} <span class="small">Es una interpretación: BuildAlpha encuentra la regla con datos y no explica el porqué.</span></p></div>
    <div><h3>Cómo sale</h3>
     <ol style="margin:0 0 0 18px;padding:0;font-size:13.5px;line-height:1.55">
      <li><b>Por precio (stop):</b> stop fijo en cierre del futuro − <b>${L.k} × ATR(20)</b>${R2&&R2.stopPct!=null?`, que en los últimos 5 años quedó en promedio a <b>${pct(R2.stopPct,1)}</b> debajo del precio`:''}. ${L.k<=1?'Es un stop corto: salta seguido, pero cada pérdida es chica.':L.k>=4?'Es un stop muy lejos: casi nunca salta; está para un desastre.':'Es un stop intermedio.'}</li>
      <li><b>Por tiempo:</b> si no tocó el stop, sale en la apertura ${L.mt===1?'del día siguiente a la entrada':`después de ${L.mt} días en el trade`} (Max_Time ${L.mt}), gane o pierda.</li>
      ${L.profx?'<li><b>Por ganancia:</b> el primer día que cierra por encima del precio de entrada, sale en la apertura siguiente (Profitable_Closes 1).</li>':''}
      <li><b>No tiene objetivo de ganancia</b>${L.profx?' fijo':''}: lo que gane depende de cuánto suba en esos días.</li></ol>
     ${R2?`<p class="note" style="margin-top:8px">En el backtest, el <b>${pct(R2.slPct,0)}</b> de los trades salió por stop y el resto por tiempo${L.profx?' o por cierre en ganancia':''}. Promedio en el trade: <b>${fmt(R2.holdAvg,1)} días</b>.</p>`:''}</div>
   </div>
   <div class="grid2">
    <div><h3>En qué mercado le va mejor</h3>
     ${S2?`<p class="note">${rr.txt}</p>
     <div class="tbl" style="margin-top:8px"><table><thead><tr><th class="l">Régimen</th><th class="l"></th><th>Trades</th><th>Ganadores</th><th>Media por trade</th><th>PF</th></tr></thead><tbody>${regRows}</tbody></table></div>
     <p class="small" style="margin-top:6px">Cada trade se clasifica con la semana cerrada anterior a la entrada (sin mirar el futuro), con datos semanales de IB desde 2007. <b>Tendencia:</b> el ETF sobre o bajo su media de 40 semanas (~200 días). <b>Volatilidad:</b> volatilidad de 20 semanas del ETF, en tercios de su historia. <b>Corrección:</b> el S&P 10% o más por debajo de su máximo de 52 semanas. ${owns.length?'Series propias: '+owns.join(', ')+'. ':''}Para XLF, XME, EWJ, IBB y los ETFs sin futuro se usa el SPY porque IB no devolvió su historia semanal. Para comparar regímenes mirar el PF y el % de ganadores: la media por trade sube sola cuando hay más volatilidad. Quedan fuera ${S2.skipped} trades anteriores a 2008. Hojas: ${S2.sheets.join(', ')}.</p>`:'<p class="note">No está en el backtest: no se puede medir por régimen.</p>'}</div>
    <div><h3>Qué riesgo tiene</h3><p class="note">${esc(L.risk)}</p>
     ${R2?`<dl class="kv" style="margin-top:8px"><dt>Trades ganadores</dt><dd>${pct(R2.win,0)} de ${R2.n}</dd><dt>Ganancia media / pérdida media</dt><dd><span class="pos">${pct(R2.avgWin,2)}</span> / <span class="neg">${pct(R2.avgLoss,2)}</span></dd><dt>Racha más larga de pérdidas</dt><dd>${R2.maxLossRun} trades seguidos</dd><dt>Los 3 peores trades</dt><dd>${R2.worst.map(w=>`<span class="neg">${pct(w.r,1)}</span> ${dm(w.d)}/${w.d.slice(0,4)} ${w.etf}`).join('<br>')}</dd></dl>
     <p class="small" style="margin-top:6px">Retornos sobre el nocional del trade en el ETF (backtest, todas las hojas de la estrategia en el sistema). Mirar las fechas de los peores trades: dicen en qué tipo de mercado se rompe.</p>`:''}</div>
   </div>
   <div><h3>Indicadores que usa</h3><dl class="kv" style="grid-template-columns:minmax(150px,auto) 1fr">${L.ind.map(k=>`<dt><b>${esc(LG.gloss[k][0])}</b></dt><dd style="font-family:var(--f-body);font-size:13px">${esc(LG.gloss[k][1])}</dd>`).join('')}</dl></div>
  </div>
  <details class="panel"><summary>Glosario completo de indicadores</summary><dl class="kv" style="grid-template-columns:minmax(150px,auto) 1fr;margin-top:10px">${Object.values(LG.gloss).map(([a,b])=>`<dt><b>${esc(a)}</b></dt><dd style="font-family:var(--f-body);font-size:13px">${esc(b)}</dd>`).join('')}</dl></details>
  <div id="lg-fi" style="display:flex;flex-direction:column;gap:18px"></div>`;
  fichaInto(el.querySelector('#lg-fi'),L.name);
  el.querySelector('#lg-s').onchange=e=>{ST.lg=e.target.value;rLogica()};
  for(const tr of el.querySelectorAll('tr[data-n]'))tr.onclick=()=>{ST.lg=tr.dataset.n;rLogica();el.querySelector('h3').scrollIntoView&&el.querySelectorAll('.panel')[1].scrollIntoView({behavior:'smooth',block:'start'})};
}

function rFuentes(){
  document.getElementById('v-fuentes').innerHTML=`<h2>Supuestos y fuentes</h2>
  <div class="grid2"><div class="panel"><h3>Datos</h3><ul class="src">
   <li><b>Backtest:</b> archivo <i>Backtest_Completo_Estrategias.xlsx</i> (versión completa que mandó Carlos el 26/10/2026), 35 hojas, una por estrategia y ETF, 17,715 trades del 18/01/2000 al cierre del 21/10/2026. Un trade marcado END sigue abierto y se cierra al 21/10. Cada trade usa ~$100k de nocional en el ETF; "Result" ya descuenta $15.20 de comisión por trade (verificado: (salida − entrada) × acciones − 15.20).</li>
   <li><b>Base del P/L:</b> "% del nocional" pesa cada trade por su retorno, como si el contrato siempre valiera lo de hoy. "$ por contrato (como MC)" multiplica cada retorno por el nocional de 1 contrato en esa época, aproximado como nocional actual × precio del ETF al entrar ÷ precio del ETF hoy (${D.pxAsOf}). MultiCharts mide así (1 contrato fijo, en $), por eso su Sharpe sale más bajo cuando el precio subió mucho, como el NQ desde 2009.</li>
   <li><b>De trades a serie diaria:</b> el P/L de cada trade se reparte en partes iguales entre sus días hábiles. No hay precios diarios en el archivo, así que la volatilidad diaria sale baja y el Sharpe diario alto. Por eso todas las métricas de riesgo se calculan con retornos mensuales (la curva diaria se usa solo para el drawdown y el margen).</li>
   <li><b>Sharpe:</b> (promedio del periodo − tasa libre de riesgo del periodo) ÷ desviación del periodo × √(periodos por año). Tasa y costo extra por trade se cambian arriba (por defecto 0). Comparado con el reporte de MultiCharts (<i>24 Strats MC Dashboard.xlsx</i>): su "Avg Monthly Return ÷ Monthly Return StdDev × √12" da GLD1 1.07, XME1 1.22, XLI2 1.24, XLI1 0.92, y aquí (desde 2000) 1.10, 1.16, 1.30, 1.05. MC muestra 0.71, 0.75, 0.66, 0.57 porque resta una tasa libre de riesgo (cuál exactamente no está verificado).</li>
   <li><b>Sin reinversión:</b> las curvas suman P/L sobre un nocional fijo, igual que 1 contrato fijo.</li>
   <li><b>SPY mensual:</b> historial de precios de Interactive Brokers (cierres mensuales, sin dividendos), consultado el 23/10/2026.</li>
   <li><b>Precios de futuros:</b> snapshots de IB del 23/10/2026 (YMZ6, GCZ6, CLZ6, XAFZ6, XAKZ6) y fills del registro de órdenes para el resto, con la fecha de cada uno en la pestaña Margen.</li></ul></div>
  <div class="panel"><h3>Márgenes y multiplicadores</h3><ul class="src">
   <li><b>Márgenes de futuros (14 de 15):</b> ES, NQ, RTY, YM, NKD, GC, SI y los 7 Select Sector (XAF, XAK, XAI, XAE, XAV, XAB, XAY) vienen de la <a href="https://investors.interactivebrokers.com/en/trading/margin-futures-fops.php?hm=us&ex=us&rgt=0&rsk=1&pm=0&rst=101004100808080101" target="_blank" rel="noopener">página oficial de márgenes de futuros de IBKR</a> (residentes EE.UU., inicial y mantenimiento overnight), consultada el 06/11/2026. IBKR los cambia con frecuencia. <b>CL</b> sigue provisional: la sección NYMEX de esa página no se pudo leer, así que usa AMP Futures (mantenimiento de bolsa, 23/10/2026). Los micros también son de AMP.</li>
   <li><b>E-mini Select Sector:</b> multiplicador $100, salvo <b>XAF $250</b>, según el <a href="https://www.cmegroup.com/trading/equity-index/e-mini-s-and-p-select-sector-futures-faq.html" target="_blank" rel="noopener">FAQ de CME</a>. El margen ya es el de IBKR (ver arriba). Si se borra el margen de un contrato en la tabla, se usa un supuesto de ${ST.secPct}% del nocional.</li>
   <li><b>Multiplicadores de ES $50, NQ $20, RTY $50, YM $5, NKD $5, GC 100 oz, SI 5,000 oz, CL 1,000 bbl:</b> especificaciones estándar de CME. No se pudieron reverificar hoy en cmegroup.com.</li>
   <li><b>ETF:</b> Reg T de la Reserva Federal pide 50% inicial (<a href="https://www.ecfr.gov/current/title-12/chapter-II/subchapter-A/part-220" target="_blank" rel="noopener">12 CFR 220</a>) y FINRA 25% de mantenimiento mínimo (<a href="https://www.finra.org/rules-guidance/rulebooks/finra-rules/4210" target="_blank" rel="noopener">Regla 4210</a>). IB puede exigir más.</li>
   <li><b>Cómo verificar el margen real:</b> en TWS o Gateway con la cuenta paper, abrir el ticket del contrato y usar <b>Check Margin</b> (What-If). Cargar el número en la pestaña Margen.</li></ul></div></div>
  <div class="panel"><h3>Lo que el backtest no captura</h3><ul class="src">
   <li><b>Tracking ETF → futuro:</b> el futuro sigue al índice, no al ETF. En SPY/ES, QQQ/NQ, IWM/RTY, DIA/YM, GLD/GC y XL?/XA? es muy cercano. En los marcados <span class="flag w">proxy</span> (EWJ → NKD, USO → CL, XME → XAB) puede diferir bastante.</li>
   <li><b>Carry:</b> el precio del futuro incluye interés menos dividendos. Para trades de pocos días el efecto es chico, pero no está en el backtest.</li>
   <li><b>Stops:</b> el stop del sistema se calcula con el ATR del futuro (Data1); el backtest usa el del ETF. Con TIF DAY, de noche no hay stop.</li>
   <li><b>IM-2BAR-REJECTION:</b> el backtest es en XLF, pero el chart opera XLV → XAV. Sus números no representan lo que corre hoy.</li>
   <li><b>IM-VOL10-DOWX3:</b> la versión FUT tiene dos detalles de código pendientes de revisar.</li>
   <li><b>Sin backtest en el archivo:</b> IM-GAP4-QTDPOS (RTY) y ATR20-CEMA-DECLINE (XAY) operan pero no tienen hoja.</li>
   <li><b>Optimización:</b> pesos calculados con datos pasados. Mira siempre el resultado fuera de muestra.</li></ul></div>`;
}
